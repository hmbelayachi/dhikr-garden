<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dhikr Garden Grower</title>
  <meta name="description" content="Grow a garden with every dhikr. A gentle remembrance counter and garden game.">
  <meta name="theme-color" content="#0b100e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dhikr Garden">
  <!-- Fonts only — no other external requests at runtime -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="garden">
  <div id="app">
    <main id="screens">
      <section class="screen" id="screen-home" aria-label="Home"></section>
      <section class="screen" id="screen-practice" aria-label="Practice"></section>
      <section class="screen" id="screen-daily" aria-label="Daily rhythm"></section>
      <section class="screen" id="screen-learn" aria-label="Learning path"></section>
      <section class="screen" id="screen-herbarium" aria-label="Herbarium"></section>
      <section class="screen" id="screen-articles" aria-label="Articles"></section>
      <section class="screen" id="screen-reader" aria-label="Article reader"></section>
      <section class="screen" id="screen-progress" aria-label="Progress"></section>
      <section class="screen" id="screen-game" aria-label="Sprout climb mini-game"></section>
      <section class="screen" id="screen-getting-started" aria-label="Getting started"></section>
    </main>

    <nav id="bottomnav" aria-label="Main navigation">
      <button class="navbtn" data-screen="home" aria-label="Home">
        <svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-3.5 2.5-6 6-6 0 3.5-2.5 6-6 6z"/><path d="M12 13c0-3.5-2.5-6-6-6 0 3.5 2.5 6 6 6z"/></svg><span class="navlabel">Home</span>
      </button>
      <button class="navbtn nav-center" data-screen="practice" aria-label="Practice">
        <span class="nav-plus" aria-hidden="true">+</span><span class="navlabel">Practice</span>
      </button>
      <button class="navbtn" data-screen="learn" aria-label="Learn">
        <svg class="navsvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="navlabel">Learn</span>
      </button>
    </nav>

    <!-- Celebration / toast modal -->
    <div id="modal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-label="Celebration">
        <div class="modal-emoji" id="modal-emoji" aria-hidden="true">🌸</div>
        <h2 class="modal-title" id="modal-title">A new bloom!</h2>
        <p class="modal-sub" id="modal-sub"></p>
        <button class="btn-gold" id="modal-ok">Alhamdulillah 🤲</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- Content data (written by a separate process); the app runs without it. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
